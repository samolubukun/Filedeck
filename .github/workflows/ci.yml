name: FileDeck CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-rust:
    name: Backend Rust (cargo check & test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check compilation
        run: cargo check --manifest-path backend/Cargo.toml

      - name: Run unit & integration tests
        run: cargo test --manifest-path backend/Cargo.toml

  frontend-react:
    name: Frontend React & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: TypeScript typecheck
        run: npx --prefix frontend tsc --noEmit

      - name: Build production bundle
        run: npm run build --prefix frontend

  worker-python:
    name: Worker Python (lint & imports)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Verify worker module imports
        run: |
          python -c "import app.main; import app.routers.extraction; print('Worker imports successfully')"
        working-directory: worker
