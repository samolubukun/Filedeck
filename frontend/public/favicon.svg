<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="48" height="48" rx="14" fill="url(#deckGrad)"/>
  
  <!-- Subtle Highlight Border -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="13.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- FileDeck Signature Isometric Deck Glyph -->
  <g transform="translate(10, 10) scale(1.16)" filter="url(#softGlow)">
    <!-- Top perspective card trapezoid -->
    <path
      d="M 6.8 6.5 L 17.2 6.5 C 17.9 6.5 18.5 6.9 18.8 7.5 L 21.2 11.8 C 21.5 12.4 21.1 13.2 20.3 13.2 L 3.7 13.2 C 2.9 13.2 2.5 12.4 2.8 11.8 L 5.2 7.5 C 5.5 6.9 6.1 6.5 6.8 6.5 Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Middle deck card -->
    <line
      x1="3.6"
      y1="17"
      x2="20.4"
      y2="17"
      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <!-- Bottom base deck card -->
    <line
      x1="5.2"
      y1="20.8"
      x2="18.8"
      y2="20.8"
      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
    />
  </g>
</svg>